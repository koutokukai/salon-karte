<!-- Instagram用アセットの原本。marketing/social/render.mjs で out/*.png に書き出す。 -->
<title>サロンカルテ SNSアセット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root { --violet:#7c5cbf; --ink:#101018; --paper:#f7f6f3; }
  body { margin:0; background:#333; font-family:"Zen Kaku Gothic New",sans-serif; }
  .art { width:1080px; height:1080px; position:relative; overflow:hidden; display:flex; }
  .dark { background:var(--ink); color:#fff; }
  .dark::before {
    content:""; position:absolute; inset:-40% -20% auto -20%; height:90%;
    background:radial-gradient(ellipse at 50% 0%, var(--violet) 0%, transparent 65%); opacity:.6;
  }
  .inner { position:relative; padding:96px; display:flex; flex-direction:column; justify-content:space-between; width:100%; }
  .kicker { font-family:"Roboto Mono",monospace; font-size:26px; letter-spacing:.22em; color:#b7b3c6; }
  .head { font-family:"Zen Old Mincho",serif; font-weight:900; font-size:96px; line-height:1.42; }
  .head.small { font-size:80px; }
  .sub { font-size:30px; line-height:1.9; color:#c9c6d6; }
  .handle { font-family:"Roboto Mono",monospace; font-size:26px; color:#8f8ca0; letter-spacing:.08em; }

  /* アイコン系 */
  .flat { background:var(--paper); align-items:center; justify-content:center; }
  .flat svg { width:760px; height:760px; }
  .cover { background:var(--paper); align-items:center; justify-content:center; }
  .cover svg { width:430px; height:430px; }
  svg { stroke:var(--violet); fill:none; stroke-width:22; stroke-linecap:round; stroke-linejoin:round; }
  .cover svg { stroke-width:14; }
</style>

<!-- ══ 文字だけの投稿 ══ -->
<div class="art dark" data-name="post-01-headline">
  <div class="inner">
    <span class="kicker">SALON KARTE</span>
    <div class="head">前回のカラー、<br>思い出せますか。</div>
    <span class="handle">@karte_lab</span>
  </div>
</div>

<div class="art dark" data-name="post-02-monitor">
  <div class="inner">
    <span class="kicker">MONITOR — 10 SEATS</span>
    <div>
      <div class="head small">先行モニター<br>10名募集</div>
      <p class="sub" style="margin-top:40px">
        1ヶ月使ってみてください。<br>
        使ってくださった方は、その後もずっと無料です。
      </p>
    </div>
    <span class="handle">@karte_lab</span>
  </div>
</div>

<div class="art dark" data-name="post-03-nofree">
  <div class="inner">
    <span class="kicker">NO RESERVATION FEATURE</span>
    <div>
      <div class="head small">予約管理は<br>入っていません。</div>
      <p class="sub" style="margin-top:40px">
        予約は今お使いのもので大丈夫です。<br>
        カルテだけに絞って、入力を軽くしました。
      </p>
    </div>
    <span class="handle">@karte_lab</span>
  </div>
</div>
