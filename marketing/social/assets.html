<!-- Instagram用アセットの原本。marketing/social/render.mjs で out/*.png に書き出す。 -->
<title>サロンカルテ SNSアセット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root { --violet:#7c5cbf; --ink:#101018; --paper:#f7f6f3; }
  body { margin:0; background:#333; font-family:"Zen Kaku Gothic New",sans-serif; }
  .art { width:1080px; height:1080px; position:relative; overflow:hidden; display:flex; }
  .dark { background:var(--paper); color:var(--ink); }
  .dark::before {
    content:""; position:absolute; inset:-40% -20% auto -20%; height:90%;
    background:radial-gradient(ellipse at 82% 6%, var(--violet) 0%, transparent 55%); opacity:.16;
  }
  .inner { position:relative; padding:96px; display:flex; flex-direction:column; justify-content:space-between; width:100%; }
  .kicker { font-family:"Roboto Mono",monospace; font-size:26px; letter-spacing:.22em; color:#6b6f7a; }
  .head { font-family:"Zen Old Mincho",serif; font-weight:900; font-size:96px; line-height:1.42; }
  .head.small { font-size:80px; }
  .sub { font-size:30px; line-height:1.9; color:#4e535f; }
  .handle { font-family:"Roboto Mono",monospace; font-size:26px; color:#6b6f7a; letter-spacing:.08em; }

  /* アイコン系 */
  .flat { background:var(--paper); align-items:center; justify-content:center; }
  .flat svg { width:760px; height:760px; }
  .cover { background:var(--paper); align-items:center; justify-content:center; }
  .cover svg { width:430px; height:430px; }
  svg { stroke:var(--violet); fill:none; stroke-width:22; stroke-linecap:round; stroke-linejoin:round; }
  .cover svg { stroke-width:14; }

  /* ══ ハイライトカバー ══
     直径60pxの円に縮む前提。細線は使わず、文字の面で見せる。
     中央の直径600px以内に収める（Instagram が円で切り抜くため）。 */
  .hl { background:linear-gradient(155deg,#f3ede9 0%,#e8ddd9 55%,#dfd2d3 100%); align-items:center; justify-content:center; }
  .hl::before {
    content:""; position:absolute; left:50%; top:50%; width:740px; height:740px;
    transform:translate(-50%,-50%); border-radius:50%;
    border:2px solid rgba(93,74,110,.20);
  }
  .hl-in {
    position:relative; width:700px; height:700px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    color:#4a3b55; text-align:center;
  }
  .hl-en {
    font-family:"Roboto Mono",monospace; font-size:38px; letter-spacing:.34em;
    color:#8a7a93; text-indent:.34em;
  }
  .hl-jp {
    font-family:"Zen Old Mincho",serif; font-weight:900; font-size:158px; line-height:1.26;
    letter-spacing:.04em;
  }
  .hl-two .hl-jp { font-size:126px; }
  .hl-accent { color:#fff; }
  .hl-accent .hl-en { color:rgba(255,255,255,.82); }
  .art[data-name="cover-5-monitor"] { background:linear-gradient(155deg,#6f5a80 0%,#5b4769 60%,#493757 100%); }
  .art[data-name="cover-5-monitor"]::before { border-color:rgba(255,255,255,.34); }

  /* ══ プロフィールアイコン ══ */
  .icon { background:linear-gradient(155deg,#6f5a80 0%,#5b4769 58%,#493757 100%); align-items:center; justify-content:center; }
  .icon svg { width:600px; height:600px; }

  /* アイコン別案：屋号の頭文字を明朝で。32pxまで縮んでも形が残る。 */
  .icon-word { position:relative; }
  .icon-word::before {
    content:""; position:absolute; left:50%; top:50%; width:780px; height:780px;
    transform:translate(-50%,-50%); border-radius:50%; border:6px solid rgba(255,255,255,.30);
  }
  .icon-word .mark {
    position:relative; font-family:"Zen Old Mincho",serif; font-weight:900;
    font-size:470px; line-height:1; color:#fff; margin-top:-18px;
  }
</style>

<!-- ══ 文字だけの投稿 ══ -->
<div class="art dark" data-name="post-01-headline">
  <div class="inner">
    <span class="kicker">SALON KARTE</span>
    <div class="head">前回のカラー、<br>思い出せますか。</div>
    <span class="handle">@karte_lab</span>
  </div>
</div>

<div class="art dark" data-name="post-02-monitor">
  <div class="inner">
    <span class="kicker">MONITOR — 10 SEATS</span>
    <div>
      <div class="head small">先行モニター<br>10名募集</div>
      <p class="sub" style="margin-top:40px">
        1ヶ月使ってみてください。<br>
        使ってくださった方は、その後もずっと無料です。
      </p>
    </div>
    <span class="handle">@karte_lab</span>
  </div>
</div>

<div class="art dark" data-name="post-03-nofree">

    <span class="kicker">NO RESERVATION FEATURE</span>
    <div>
      <div class="head small">予約管理は<br>入っていません。</div>
      <p class="sub" style="margin-top:40px">
        予約は今お使いのもので大丈夫です。<br>

      </p>

    <span class="handle">@karte_lab</span>
  </div>
</div>

<!-- ══ プロフィールアイコン ══ -->
<!-- フィードでは32px、プロフィールでも150px程度。細線は消えるので面で作る。 -->
<div class="art icon" data-name="icon-profile">
  <svg viewBox="0 0 200 200">
    <rect x="42" y="28" width="116" height="144" rx="20" fill="none" stroke="#fff" stroke-width="13"/>
    <rect x="70" y="66" width="60" height="13" rx="6.5" fill="#fff" stroke="none"/>
    <rect x="70" y="94" width="60" height="13" rx="6.5" fill="#fff" stroke="none"/>
    <rect x="70" y="122" width="34" height="13" rx="6.5" fill="#fff" stroke="none"/>
  </svg>
</div>

<!-- プロフィールアイコン（別案：明朝の一文字マーク） -->
<div class="art icon icon-word" data-name="icon-profile-word">
  <span class="mark">カ</span>
</div>

<!-- ══ ハイライトカバー ══ -->
<!--
  ハイライトは**プロフィールで直径60px前後の円**に縮む。
  細い線画はここで消える。文字を主役にして、縮んでも読めるようにする。
  Instagram は中央を円で切り抜くので、要素は中央の直径600px以内に収める。
-->
<div class="art hl" data-name="cover-1-about">
  <div class="hl-in"><span class="hl-en">ABOUT</span><span class="hl-jp">はじめに</span></div>
</div>

<div class="art hl" data-name="cover-2-howto">
  <div class="hl-in"><span class="hl-en">HOW TO</span><span class="hl-jp">使い方</span></div>
</div>

<div class="art hl" data-name="cover-3-price">
  <div class="hl-in"><span class="hl-en">PRICE</span><span class="hl-jp">料金</span></div>
</div>

<div class="art hl" data-name="cover-4-faq">
  <div class="hl-in hl-two"><span class="hl-en">Q &amp; A</span><span class="hl-jp">よくある<br>質問</span></div>
</div>

<div class="art hl" data-name="cover-5-monitor">
  <div class="hl-in hl-two hl-accent"><span class="hl-en">MONITOR</span><span class="hl-jp">モニター<br>募集</span></div>
</div>

<!-- ══ アプリ画面の投稿（#5） ══ -->
<div class="art dark" data-name="post-app" style="align-items:center;justify-content:center">
  <div class="inner" style="justify-content:space-between">
    <span class="kicker">REAL SCREEN</span>
    <div style="display:flex;justify-content:center">
      <div style="width:420px;border-radius:56px;padding:14px;background:linear-gradient(160deg,#3a3a46,#16161d 60%);box-shadow:0 40px 80px -20px rgba(0,0,0,.8)">
        <img src="../lp/img/app-nail.png" alt="" style="display:block;width:100%;height:620px;object-fit:cover;object-position:top;border-radius:44px">
      </div>
    </div>
    <span class="handle">@karte_lab</span>
  </div>
</div>
